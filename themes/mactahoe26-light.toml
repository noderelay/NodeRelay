[highlights]
mention_bg   = "#fbe0e1"
mention_text = "#d70015"
keyword      = "#007aff"

[nicklist]
background   = "#f0f0f2"
text         = "#6e6e73"
op           = "#248a3d"
halfop       = "#3634a3"
voice        = "#8a6d00"
away         = "#8e8e93"

[input]
background   = "#ffffff"
text         = "#1c1c1e"
placeholder  = "#8e8e93"
nick_color   = "#0071a4"
