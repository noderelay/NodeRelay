# mactahoe26-light — macOS Tahoe (macOS 26) "Clear Glass" light theme for UplinkIRC
# Off-white glass surfaces + Apple's high-contrast light-mode system colors

[general]
background   = "#fbfbfd"
text         = "#1c1c1e"
border       = "#d1d1d6"
accent       = "#007aff"

[sidebar]
background   = "#f0f0f2"
text         = "#6e6e73"
active       = "#1c1c1e"
unread       = "#007aff"
mention      = "#d70015"
server       = "#8e8e93"

[buffer]
background   = "#fbfbfd"
timestamp    = "#8e8e93"
