name: Update Flatpak manifest

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update manifest and metainfo
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          VERSION="${TAG#v}"
          TODAY="$(date -u +%Y-%m-%d)"
          MANIFEST="packaging/flatpak/io.github.noderelay.UplinkIRC.yaml"
          METAINFO="packaging/flatpak/io.github.noderelay.UplinkIRC.metainfo.xml"

          # Update tag and commit in manifest
          sed -i "s|tag: v[0-9.]*|tag: ${TAG}|" "$MANIFEST"
          sed -i "s|commit: [0-9a-f]\{40\}|commit: ${COMMIT}|" "$MANIFEST"

          # Update version and date in metainfo release entry
          sed -i "s|<release version=\"[^\"]*\" date=\"[^\"]*\"|<release version=\"${VERSION}\" date=\"${TODAY}\"|" "$METAINFO"

      - name: Commit and push
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/flatpak/
          git diff --staged --quiet || \
            git commit -m "chore: update Flatpak manifest to ${TAG}" && \
            git push
